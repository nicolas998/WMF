[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    "ninja",
    "numpy>=1.26",
    # f2py needs it to read Fortran sources with non-ASCII (accented) comments
    "charset_normalizer",
]

[project]
name = "wmf"
version = "1.1.0"
description = "Watershed Modelling Framework"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Nicolas Velasquez G", email = "nicolas.velasquezgiron@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
# Reading/writing rasters, shapefiles and netCDF basin files
geo = ["netCDF4", "rasterio", "gdal"]
# NSGA-II calibration support
calib = ["deap"]

[project.urls]
Homepage = "https://github.com/nicolas998/WMF"

[tool.cibuildwheel]
# 64-bit CPython only; PyPy is not supported by the Fortran extensions
archs = "auto64"
skip = "*-musllinux*"
# Light import test: the full smoke test needs GDAL, which has no PyPI
# wheels on Windows. Run from a temp dir so the source tree never shadows
# the installed package.
test-command = "python -c \"from wmf import wmf, cu, models; assert hasattr(wmf, 'Basin'); print('wheel import OK')\""

[tool.cibuildwheel.windows]
# Force the MinGW toolchain (gfortran has no MSVC counterpart)
environment = { CC = "gcc", CXX = "g++", FC = "gfortran" }
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
